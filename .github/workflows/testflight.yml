name: TestFlight

# Manual trigger only: Actions タブ → TestFlight → Run workflow.
# Requires repository secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true

      - run: flutter pub get

      # Runs outside bundler on purpose: invoking flutter from inside
      # `bundle exec fastlane` breaks its CocoaPods detection.
      - name: Build Flutter iOS (unsigned)
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }} --build-name=0.1.0

      # Rebuild the .p8 into strict PEM (BEGIN/END + 64-char lines) so
      # xcodebuild's cloud signing accepts it even if the secret was pasted
      # as a single line — fastlane tolerates that, xcodebuild does not.
      - name: Prepare App Store Connect API key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'EOF'
          import os, re, textwrap
          raw = os.environ["ASC_KEY_P8"].strip()
          body = re.sub(r"-----[^-]+-----", "", raw)
          body = re.sub(r"\s+", "", body)
          pem = ("-----BEGIN PRIVATE KEY-----\n"
                 + "\n".join(textwrap.wrap(body, 64))
                 + "\n-----END PRIVATE KEY-----\n")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8"), "w") as f:
              f.write(pem)
          EOF

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          bundle install
          bundle exec fastlane beta
