name: TestFlight

# Manual trigger only: Actions タブ → TestFlight → Run workflow.
# Requires repository secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8.
on:
  workflow_dispatch:

jobs:
  testflight:
    # macos-15 ships Xcode 16.x. macos-latest currently defaults to Xcode 26.x,
    # whose API-key "cloud signing" rejects its own bearer token ("bearer token
    # not properly signed") even with a valid key that the ASC API accepts.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pin to the newest stable Xcode 16 and export DEVELOPER_DIR so every
      # later step (including fastlane/gym) uses it — xcode-select alone is not
      # always honored by gym.
      - name: Select a stable Xcode
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app || true
          picked=""
          for v in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r) \
                   $(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V -r); do
            if [ -d "$v" ]; then picked="$v"; break; fi
          done
          if [ -z "$picked" ]; then picked="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$picked/Contents/Developer"
          echo "DEVELOPER_DIR=$picked/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected: $picked"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true

      - run: flutter pub get

      # Runs outside bundler on purpose: invoking flutter from inside
      # `bundle exec fastlane` breaks its CocoaPods detection.
      - name: Build Flutter iOS (unsigned)
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }} --build-name=0.1.0

      # Rebuild the .p8 into strict PEM and place it where xcodebuild's cloud
      # signing looks by default: ~/.appstoreconnect/private_keys/ with the
      # canonical name AuthKey_<KEYID>.p8. Xcode 26 derives the JWT's key id
      # from that filename; without it the bearer token is signed with the
      # wrong kid and Apple rejects it ("bearer token not properly signed"),
      # even though the same key authenticates fine via the raw API.
      - name: Prepare App Store Connect API key file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'EOF'
          import os, re, textwrap
          key_id = os.environ["ASC_KEY_ID"].strip()
          raw = os.environ["ASC_KEY_P8"].strip()
          body = re.sub(r"-----[^-]+-----", "", raw)
          body = re.sub(r"\s+", "", body)
          pem = ("-----BEGIN PRIVATE KEY-----\n"
                 + "\n".join(textwrap.wrap(body, 64))
                 + "\n-----END PRIVATE KEY-----\n")
          name = f"AuthKey_{key_id}.p8"
          targets = [
              os.path.join(os.environ["HOME"], ".appstoreconnect", "private_keys"),
              os.path.join(os.environ["HOME"], "private_keys"),
              os.environ["RUNNER_TEMP"],
          ]
          for d in targets:
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, name), "w") as f:
                  f.write(pem)
          print("Wrote", name, "to:", *targets, sep="\n  ")
          EOF

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          bundle install
          bundle exec fastlane beta
