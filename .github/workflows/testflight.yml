name: TestFlight

# Manual trigger only: Actions タブ → TestFlight → Run workflow.
# Requires repository secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Prepare App Store Connect API key files
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 - <<'EOF'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "asc_api_key.json")
          with open(path, "w") as f:
              json.dump({
                  "key_id": os.environ["ASC_KEY_ID"],
                  "issuer_id": os.environ["ASC_ISSUER_ID"],
                  "key": os.environ["ASC_KEY_P8"],
                  "in_house": False,
              }, f)
          EOF

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_JSON_PATH: ${{ runner.temp }}/asc_api_key.json
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          bundle install
          bundle exec fastlane beta
